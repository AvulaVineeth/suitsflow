# Integration tests only: loads one harmless custom marker signature.
DatabaseDirectory /etc/clamav-test/database
TCPSocket 3310
TCPAddr 0.0.0.0
Foreground yes
PidFile /tmp/clamd.pid
TemporaryDirectory /tmp
MaxThreads 2
MaxQueue 4
StreamMaxLength 1M
MaxFileSize 1M
MaxScanSize 2M
AlertExceedsMax yes
AlertEncrypted yes
ReadTimeout 10
CommandReadTimeout 10
SendBufTimeout 1000

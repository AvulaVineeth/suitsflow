name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and development dependencies
        run: |
          python -m pip install uv==0.11.28
          uv sync --locked --extra dev
      - name: Check formatting
        run: uv run --no-sync ruff format --check src tests
      - name: Lint
        run: uv run --no-sync ruff check src tests
      - name: Type check
        run: uv run --no-sync mypy src
      - name: Test
        run: uv run --no-sync pytest

services:
  api:
    build:
      context: .
    environment:
      SUITSFLOW_ENVIRONMENT: local
      SUITSFLOW_DEBUG: "true"
      SUITSFLOW_DATABASE_URL: postgresql+asyncpg://suitsflow:suitsflow@postgres:5432/suitsflow
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres-test:
    image: postgres:16-alpine
    profiles: [test]
    environment:
      POSTGRES_DB: suitsflow_test
      POSTGRES_USER: suitsflow
      POSTGRES_PASSWORD: suitsflow
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suitsflow -d suitsflow_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: suitsflow
      POSTGRES_USER: suitsflow
      POSTGRES_PASSWORD: suitsflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suitsflow -d suitsflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "suitsflow"
version = "0.1.0"
description = "Enterprise legal and compliance AI platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "SuitsFlow Contributors" }]
dependencies = [
  "alembic>=1.14,<2.0",
  "asyncpg>=0.30,<1.0",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "mypy>=1.13,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.8,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/suitsflow"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=suitsflow --cov-report=term-missing"
testpaths = ["tests"]
markers = ["integration: requires a dedicated PostgreSQL test database"]

[tool.coverage.run]
branch = true
source = ["suitsflow"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["suitsflow"]
warn_unreachable = true
